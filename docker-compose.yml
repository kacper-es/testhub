services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Wystawione dla lokalnych `npx prisma migrate dev` / `npm run check`
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Host `db` (NIE localhost). Ten jawny wpis nadpisuje wartość localhost
      # z pliku .env — .env służy tylko lokalnym narzędziom (prisma migrate dev,
      # npm run check) uruchamianym poza kontenerem.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      # Puste = cookie z flagą `secure` (wymaga HTTPS). `false` tylko dla wdrożenia
      # po zwykłym HTTP, dopóki nie ma reverse proxy z TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Jira Cloud (read-only). Puste domyślne — brak konfiguracji nie blokuje startu.
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
